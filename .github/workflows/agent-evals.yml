# Opt in with RUN_AGENT_EVALS=true and secret ANTHROPIC_API_KEY.
# A disabled job is visibly skipped; an enabled job without credentials fails.
# Remove: delete this file.
name: Agent evals
on:
  workflow_dispatch:
  pull_request:
    paths: ['plugins/sdlc/**', 'evals/**']
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
jobs:
  evals:
    if: ${{ vars.RUN_AGENT_EVALS == 'true' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run agent evals
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Agent evals enabled but ANTHROPIC_API_KEY is missing"
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          python3 evals/run.py --command '["claude","-p"]' --harness "Claude Code $(claude --version)" --model "${{ vars.EVAL_MODEL || 'default' }}" > eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results.json
          if-no-files-found: ignore
