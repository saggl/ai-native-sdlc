# Agent evals: runs evals/*.json through `claude -p` when agent config changes, plus nightly.
# Needs secret ANTHROPIC_API_KEY. Pass-rate gate: env EVAL_PASS_RATE (default 0.9).
# Remove: delete this file. Case format: {"prompt": "...", "check": "shell cmd, exit 0 = pass"}.
name: Agent evals
on:
  pull_request:
    paths: ['CLAUDE.md', 'AGENTS.md', 'REVIEW.md', '.claude/**', '.sdlc/project.json']
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_PASS_RATE: '0.9'
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, sys
          tools = "Read,Edit,Bash(git *),Bash(python3 *),Bash(make test)"  # adjust to your project
          cases = sorted(glob.glob("evals/*.json"))
          if not cases:
              sys.exit("no evals/*.json cases found")
          passed = 0
          for path in cases:
              case = json.load(open(path))
              subprocess.run(["claude", "-p", case["prompt"], "--allowedTools", tools,
                              "--output-format", "json"], stdout=subprocess.DEVNULL)
              ok = subprocess.run(case["check"], shell=True).returncode == 0
              print(("PASS " if ok else "FAIL ") + path)
              passed += ok
              subprocess.run(["git", "checkout", "--", "."])  # isolate cases
              subprocess.run(["git", "clean", "-fdq"])
          rate = passed / len(cases)
          floor = float(os.environ["EVAL_PASS_RATE"])
          print(f"pass rate {rate:.2f} (threshold {floor})")
          sys.exit(0 if rate >= floor else 1)
          PY
