# Handoff: when an intent approval lands on main, draft spec.md on a branch and open a PR.
# Needs secret ANTHROPIC_API_KEY. The agent has no git tools; this job pushes only the spec branch.
# The spec PR still needs a human decision; nothing pushes to main.
# Remove: delete this file. UNVERIFIED in CI: plugin marketplace install commands below.
name: SDLC handoff
on:
  push:
    branches: [main]
    paths: ['changes/*/state.json']
permissions:
  contents: write
  pull-requests: write
jobs:
  draft-spec:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Find newly approved intents
        run: |
          python3 - <<'PY' > ids.txt
          import glob, json, os, subprocess
          def approved(text):
              try: d = json.loads(text)
              except ValueError: return False
              return any(a.get("stage") == "intent" for a in d.get("approvals", []))
          for p in glob.glob("changes/*/state.json"):
              cid = p.split("/")[1]
              old = subprocess.run(["git", "show", "HEAD~1:" + p], capture_output=True, text=True)
              if approved(open(p).read()) and not (old.returncode == 0 and approved(old.stdout)) \
                 and not os.path.exists(f"changes/{cid}/spec.md"):
                  print(cid)
          PY
          cat ids.txt
          [ -s ids.txt ] && echo "FOUND=1" >> "$GITHUB_ENV" || true
      - name: Install workflow
        if: env.FOUND == '1'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add saggl/ai-native-sdlc && claude plugin install sdlc@ai-native-sdlc
      - name: Draft specs and open PRs
        if: env.FOUND == '1'
        run: |
          git config user.name "sdlc-bot" && git config user.email "sdlc-bot@users.noreply.github.com"
          while read -r id; do
            git checkout -b "sdlc/$id-spec"
            claude -p "/sdlc:run $id" --allowedTools "Read,Write,Edit,Bash(python3 *)"
            git add -A "changes/$id" && git commit -m "Draft spec for $id" || { git checkout -; continue; }
            git push origin "sdlc/$id-spec"
            gh pr create --base main --head "sdlc/$id-spec" --title "Draft spec: $id" \
              --body "Agent-drafted spec.md for approved intent $id. Human review required."
            git checkout main
          done < ids.txt
